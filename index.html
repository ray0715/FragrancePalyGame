const SAY=['你錯了！','請離開！','認真點好嗎？','鼻子是裝飾品嗎？','再聞一次啦！','寶箱說：不是我！'];
function pop(src,t,cls,x,btn){$('mimg').src=src;$('mtitle').textContent=t;$('mtitle').className=cls;$('mx').style.display=x?'flex':'none';$('mclose').textContent=btn;$('modal').classList.add('show');}
const $=id=>document.getElementById(id);
function lockTeam(){const m=/^#team-(\d{2})$/.exec(location.hash);return m&&+m[1]>=1&&+m[1]<=10?+m[1]:0;}
function buildTeams(){const t=lockTeam();
 if(t){$('teams').innerHTML=`<button class="team" data-team="${t-1}">第 ${String(t).padStart(2,'0')} 隊・開始任務</button>`;document.querySelector('.startbar').textContent='🧭 你們的專屬任務｜MISSION START';document.querySelector('.brand').textContent=`第 ${String(t).padStart(2,'0')} 隊｜漂流日記`;$('back').style.display='none';}
 else{$('teams').innerHTML=Array.from({length:10},(_,i)=>`<button class="team" data-team="${i}">第 ${i+1} 隊</button>`).join('');$('back').style.display='';}}
buildTeams();window.addEventListener('hashchange',()=>{buildTeams();back();});
$('teams').addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b)start(+b.dataset.team);});
function start(n){tn=n;team=T2D[n];$('intro').style.display='none';$('game').style.display='block';$('result').classList.remove('visible');
 $('teamlabel').textContent=`第 ${n+1} 隊 · 專屬任務`;['d1','d2','d3'].forEach(i=>$(i).value='');$('chest').src=CHEST;$('feedback').textContent='';$('d1').focus();}
['d1','d2','d3'].forEach((id,k,a)=>{$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^1-5]/g,'').slice(0,1);if(e.target.value&&k<2)$(a[k+1]).focus();});});
$('open').addEventListener('click',()=>{const code=$('d1').value+$('d2').value+$('d3').value;
 if(code.length<3){$('feedback').textContent='請輸入三位數密碼。';return;}
 const d=D[ORDER[team]];
 if(code===d[0]){$('chest').src=OPEN;$('loc').innerHTML=`${d[1]}<br>${d[2]}〈${d[3]}〉`;$('result').classList.add('visible');$('feedback').textContent='寶箱打開了！';
   pop(OKIMG,'你成功了！','good',false,'看寶箱裡的位置');}
 else{['d1','d2','d3'].forEach(i=>$(i).value='');$('feedback').textContent='寶箱打不開，再聞聞看香氣的順序。';
   pop(BAD[Math.floor(Math.random()*BAD.length)],SAY[Math.floor(Math.random()*SAY.length)],'bad',true,'再試一次');}});
function back(){$('game').style.display='none';$('intro').style.display='block';}
$('back').addEventListener('click',back);
$('mclose').addEventListener('click',()=>{$('modal').classList.remove('show');if($('result').classList.contains('visible'))$('result').scrollIntoView({behavior:'smooth',block:'center'});else $('d1').focus();});
})();
</script></body></html>
